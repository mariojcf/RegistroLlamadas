<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Llamadas - UMES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-header th {
            border-right: 1px solid white;
            padding: 12px 16px;
            font-weight: bold;
        }
        .table-header th:last-child {
            border-right: none;
        }
        .table-row td {
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 16px;
            color: #374151;
        }
        .table-row:nth-child(even) {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Encabezado -->
    <header class="flex items-center bg-[#00553d] px-8 py-4 shadow-md">
        <div class="bg-white rounded-md p-2 mr-5 flex items-center justify-center h-14 w-14">
            <img src="logo.png" alt="Logo UMES" class="h-full w-full object-contain">
        </div>
        <h1 class="text-white text-2xl font-bold tracking-wide">Registro de llamadas</h1>
    </header>

    <main class="max-w-7xl mx-auto mt-8 px-4 sm:px-6 lg:px-8 pb-12">
        
        <!-- Tarjeta de Ingreso de Datos -->
        <div class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <h2 class="text-[#00553d] text-2xl font-bold mb-6 border-b border-gray-300 pb-2">Ingreso de Nueva Llamada</h2>
            
            <form id="callForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                        <input type="date" id="fecha" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hora</label>
                        <input type="time" id="hora" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Número</label>
                        <input type="tel" id="numero" placeholder="Ej. 1234-5678" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                        <input type="text" id="nombre" placeholder="Nombre de quien llama" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Consulta / Trámite</label>
                        <input type="text" id="consulta" placeholder="Motivo de la llamada" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Persona Indicada</label>
                        <input type="text" id="persona" placeholder="Con quién desea hablar" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Extensión</label>
                        <input type="text" id="extension" placeholder="Ej. 101" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="bg-[#00553d] hover:bg-[#00402e] text-white font-medium py-2 px-6 rounded-md transition duration-200">
                        Guardar Registro
                    </button>
                </div>
            </form>
        </div>

        <!-- Barra de Controles / Filtros -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-4 flex flex-col sm:flex-row justify-between items-center border border-gray-200 gap-4">
            <div class="flex items-center gap-3">
                <span class="text-sm font-bold text-gray-700">Ver registros de:</span>
                <input type="month" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-[#00553d]">
                <button class="bg-gray-500 hover:bg-gray-600 text-white text-sm font-medium py-1.5 px-4 rounded transition duration-200">
                    Mostrar Todos
                </button>
            </div>
            <button onclick="alert('Exportación en desarrollo')" class="bg-[#217346] hover:bg-[#1a5c38] text-white text-sm font-medium py-1.5 px-4 rounded flex items-center gap-2 transition duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Exportar a Excel
            </button>
        </div>

        <!-- Tabla de Registros -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-[#00553d] text-white table-header text-sm">
                        <tr>
                            <th>Día/Fecha</th>
                            <th>Hora</th>
                            <th>Número</th>
                            <th>Nombres</th>
                            <th>Consulta / Trámite</th>
                            <th>Persona Indicada</th>
                            <th>Ext.</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm">
                        <!-- Los registros de Firebase aparecerán aquí -->
                    </tbody>
                </table>
                <div id="emptyState" class="text-center py-8 text-gray-500 text-sm">
                    Cargando registros...
                </div>
            </div>
        </div>

    </main>

    <!-- Script modular de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDJHEOX7_-u96XGET3CxFHyQfemqFOYXEQ",
            authDomain: "registrollamadas-4056d.firebaseapp.com",
            projectId: "registrollamadas-4056d",
            storageBucket: "registrollamadas-4056d.firebasestorage.app",
            messagingSenderId: "781617243879",
            appId: "1:781617243879:web:c74945050703316905a442",
            measurementId: "G-2FEPETR0D9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referencia a la colección "llamadas" en Firestore
        const llamadasRef = collection(db, "llamadas");

        // Función para guardar los datos al enviar el formulario
        document.getElementById('callForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                await addDoc(llamadasRef, {
                    fecha: document.getElementById('fecha').value,
                    hora: document.getElementById('hora').value,
                    numero: document.getElementById('numero').value || 'N/A',
                    nombre: document.getElementById('nombre').value,
                    consulta: document.getElementById('consulta').value,
                    persona: document.getElementById('persona').value || 'N/A',
                    extension: document.getElementById('extension').value || 'N/A',
                    timestamp: serverTimestamp() // Guarda la hora del servidor para ordenar
                });

                // Limpiar campos del formulario (mantenemos la fecha por si hay varios el mismo día)
                document.getElementById('hora').value = '';
                document.getElementById('numero').value = '';
                document.getElementById('nombre').value = '';
                document.getElementById('consulta').value = '';
                document.getElementById('persona').value = '';
                document.getElementById('extension').value = '';
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar el registro. Revisa tu conexión o las reglas de Firestore.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar Registro';
            }
        });

        // Escuchar la base de datos en tiempo real y dibujar la tabla
        const q = query(llamadasRef, orderBy("timestamp", "desc"));
        onSnapshot(q, (querySnapshot) => {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = ''; 
            
            if (querySnapshot.empty) {
                emptyState.textContent = 'No hay registros de llamadas. Llena el formulario para agregar uno.';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            querySnapshot.forEach((documento) => {
                const llamada = documento.data();
                const id = documento.id;

                // Formatear la fecha a un formato más legible (ej. 24 oct 2026)
                let formattedDate = llamada.fecha;
                if(llamada.fecha) {
                    const dateObj = new Date(llamada.fecha + 'T00:00:00');
                    formattedDate = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
                }

                // Crear fila de la tabla
                const tr = document.createElement('tr');
                tr.className = 'table-row hover:bg-gray-100 transition duration-150';
                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>${llamada.hora}</td>
                    <td>${llamada.numero}</td>
                    <td class="font-medium">${llamada.nombre}</td>
                    <td class="whitespace-normal min-w-[200px]">${llamada.consulta}</td>
                    <td>${llamada.persona}</td>
                    <td>${llamada.extension}</td>
                    <td>
                        <button onclick="window.eliminarRegistro('${id}')" class="text-red-600 hover:text-red-800 font-medium text-xs px-2 py-1 border border-red-200 rounded hover:bg-red-50 transition duration-150">
                            Eliminar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        // Función global para poder eliminar desde los botones de la tabla
        window.eliminarRegistro = async (id) => {
            if(confirm('¿Estás seguro de eliminar este registro de la base de datos?')) {
                try {
                    await deleteDoc(doc(db, "llamadas", id));
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                    alert("No se pudo eliminar el registro.");
                }
            }
        };
    </script>
</body>
</html>
